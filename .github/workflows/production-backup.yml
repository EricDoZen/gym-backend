name: Production Backup

on:
  workflow_dispatch:
  schedule:
    # 02:30 Asia/Yangon (UTC+06:30)
    - cron: '0 20 * * *'

permissions:
  contents: read
  issues: write

env:
  DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
  BACKUP_KEY_BASE64: ${{ secrets.BACKUP_KEY_BASE64 }}
  BACKUP_DIR: ${{ runner.temp }}/elite-gym-backups

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require backup secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "PRODUCTION_DATABASE_URL is missing" >&2; exit 1; }
          test -n "$BACKUP_KEY_BASE64" || { echo "BACKUP_KEY_BASE64 is missing" >&2; exit 1; }
      - name: Database invariant preflight
        run: npm run release:preflight
      - name: Create encrypted backup
        run: npm run db:backup
      - name: Verify encrypted backup
        run: npm run db:backup:verify
      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: elite-gym-production-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/elite-gym-backups/*.egymbak
          if-no-files-found: error
          retention-days: 30
      - name: Create failure alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'ALERT: Elite Gym production backup failed'
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            if (!issues.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `Scheduled production backup failed. Review workflow run ${context.runId}.`,
              })
            }
